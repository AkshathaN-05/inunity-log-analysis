
---
x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: ./airflow/Dockerfile
  image: inunity-airflow:3.3.1

  env_file:
    - ${ENV_FILE_PATH:-.env}

  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

    # Airflow metadata database
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

    # Celery result backend
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow

    # Celery message broker
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0

    # Airflow encryption
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}

    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'

    # Airflow execution API
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'

    # Airflow API authentication
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}

    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'

    # Airflow configuration file
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'

  volumes:
    # Airflow DAGs
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags

    # Airflow runtime logs
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs

    # Airflow configuration
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config

    # Airflow plugins
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins

    # PySpark jobs
    - ./spark_jobs:/opt/airflow/spark_jobs

    # Generated PDF reports: Windows project folder <-> Airflow container
    - ./reports:/opt/airflow/reports

  user: "${AIRFLOW_UID:-50000}:0"

  depends_on:
    &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy


services:

  # ---------------------------------------------------------
  # PostgreSQL - Airflow metadata database
  # ---------------------------------------------------------
  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
      POSTGRES_DB: airflow

    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s

    restart: always


  # ---------------------------------------------------------
  # Redis - Airflow message broker
  # ---------------------------------------------------------
  redis:
    image: redis:7.2-bookworm

    expose:
      - 6379

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s

    restart: always


  # ---------------------------------------------------------
  # Airflow API Server
  # ---------------------------------------------------------
  airflow-apiserver:
    <<: *airflow-common

    command: api-server

    ports:
      - "8080:8080"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8080/api/v2/monitor/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully


  # ---------------------------------------------------------
  # Airflow Scheduler
  # ---------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common

    command: scheduler

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"'
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully


  # ---------------------------------------------------------
  # Airflow DAG Processor
  # ---------------------------------------------------------
  airflow-dag-processor:
    <<: *airflow-common

    command: dag-processor

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"'
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully


  # ---------------------------------------------------------
  # Airflow Worker
  # ---------------------------------------------------------
  airflow-worker:
    <<: *airflow-common

    command: celery worker

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"

    restart: always

    depends_on:
      <<: *airflow-common-depends-on
      airflow-apiserver:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully


  # ---------------------------------------------------------
  # Airflow Triggerer
  # ---------------------------------------------------------
  airflow-triggerer:
    <<: *airflow-common

    command: triggerer

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8080/api/v2/monitor/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully


  # ---------------------------------------------------------
  # Airflow Initialization
  # ---------------------------------------------------------
  airflow-init:
    <<: *airflow-common

    entrypoint: /bin/bash

    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set "
          echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
          echo
          export AIRFLOW_UID=$$(id -u)
        fi

        one_meg=1048576

        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')

        warning_resources="false"

        if (( mem_available < 4000 )); then
          echo "WARNING: At least 4GB of memory is recommended for Docker."
          warning_resources="true"
        fi

        if (( cpus_available < 2 )); then
          echo "WARNING: At least 2 CPUs are recommended for Docker."
          warning_resources="true"
        fi

        if (( disk_available < one_meg * 10 )); then
          echo "WARNING: At least 10GB of free disk space is recommended."
          warning_resources="true"
        fi

        if [[ "$${warning_resources}" == "true" ]]; then
          echo "WARNING: Docker resources may be insufficient."
        fi

        echo "Creating shared directories if missing..."
        mkdir -p /opt/airflow/{logs,dags,plugins,config,reports}

        echo "Airflow version:"
        /entrypoint airflow version

        echo "Shared directories:"
        ls -la /opt/airflow/{logs,dags,plugins,config,reports}

        echo "Generating default Airflow configuration if missing..."
        /entrypoint airflow config list >/dev/null

        echo "Setting ownership of Airflow directories..."
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/

        echo "Initialization complete."

    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:?Set _AIRFLOW_WWW_USER_PASSWORD in your .env file}

    user: "0:0"


  # ---------------------------------------------------------
  # Airflow CLI
  # ---------------------------------------------------------
  airflow-cli:
    <<: *airflow-common

    profiles:
      - debug

    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"

    command:
      - bash
      - -c
      - airflow

    depends_on:
      <<: *airflow-common-depends-on


  # ---------------------------------------------------------
  # Flower - optional Celery monitoring UI
  # ---------------------------------------------------------
  flower:
    <<: *airflow-common

    command: celery flower

    profiles:
      - flower

    ports:
      - "5555:5555"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:5555/"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully


# ---------------------------------------------------------
# Persistent volumes
# ---------------------------------------------------------
volumes:
  postgres-db-volume:
